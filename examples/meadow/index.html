<!doctype html>
<!--
  @purpose 展示独立花草素材组成的完整页脚草坪预览
  @role 设计讨论页面；素材可单独查看，整景可暂停并查看网格
  @deps meadow.js、preview.mjs 编译的 Tailwind CSS、assets/*.png
  @gotcha 本页为素材组合预览，不接入生产站点或展示页
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>花与草 · 草坪预览</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/meadow.js"></script>
  </head>
  <body class="min-h-screen bg-[#f7f7f2] font-sans text-[#334433] antialiased">
    <main class="mx-auto max-w-[1480px] px-5 pb-12 pt-9 sm:px-12 sm:pt-12">
      <header class="flex flex-wrap items-end justify-between gap-5">
        <div>
          <p class="text-xs tracking-[0.2em] text-[#7d886e]">草坪实验 · 02</p>
          <h1 class="mt-4 font-serif text-4xl tracking-tight sm:text-5xl">花与草，长成一片。</h1>
          <p class="mt-4 text-sm leading-7 text-[#7d886e]">
            鼠尾草绿、奶油白与一点淡紫。让页面的底部，轻轻动起来。
          </p>
        </div>
        <a href="#assets" class="mb-1 text-xs text-[#71815f] underline underline-offset-4"
          >查看 5 张独立素材 ↓</a
        >
      </header>

      <section
        class="mt-9 overflow-hidden rounded-2xl border border-[#dce1d4] bg-[#fffefb]"
        aria-label="完整花草草坪预览"
      >
        <div
          class="flex items-center justify-between px-5 pt-5 text-[11px] tracking-wide text-[#919984] sm:px-7"
        >
          <span>页脚花草组合</span>
          <span id="status" role="status">正在加载花草…</span>
        </div>
        <div id="stage" class="relative h-[280px] sm:h-[360px]">
          <canvas
            id="meadow"
            class="absolute inset-0 size-full"
            role="img"
            aria-label="低草、高草、白雏菊、淡紫小花和黄色野花组成的微风草坪"
          ></canvas>
          <canvas
            id="mesh"
            class="pointer-events-none absolute inset-0 size-full"
            aria-hidden="true"
          ></canvas>
        </div>
      </section>
      <p id="error" class="mt-3 text-sm text-red-700" role="alert" hidden></p>

      <fieldset
        id="controls"
        disabled
        class="mt-5 flex flex-wrap items-center gap-x-7 gap-y-4 text-xs text-[#637458] disabled:opacity-50"
      >
        <legend class="sr-only">花草动画控制</legend>
        <button
          id="pause"
          type="button"
          class="min-w-24 rounded-full bg-[#425a3c] px-5 py-3 text-white hover:bg-[#536d4b] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#425a3c]"
        >
          暂停微风
        </button>
        <label class="flex cursor-pointer items-center gap-2"
          ><input id="grid" type="checkbox" class="size-4 accent-[#425a3c]" /> 查看网格</label
        >
        <label class="flex items-center gap-3" for="wind"
          >风力
          <input
            id="wind"
            type="range"
            min="0"
            max="100"
            value="45"
            class="w-28 accent-[#425a3c] sm:w-40"
          /><output id="wind-value" for="wind" class="w-6 tabular-nums">45</output></label
        >
        <p class="ml-auto text-[#939c88]">每株根部固定 · 摇摆略有错落</p>
      </fieldset>

      <section
        id="assets"
        class="mt-12 border-t border-[#dce1d4] pt-7"
        aria-labelledby="assets-title"
      >
        <div class="mb-5 flex flex-wrap items-baseline justify-between gap-3">
          <h2 id="assets-title" class="font-serif text-xl">组成这片花草的素材</h2>
          <p class="text-xs text-[#89957c]">独立透明 PNG · 点击查看原图</p>
        </div>
        <div class="grid grid-cols-2 gap-3 lg:grid-cols-5">
          <a
            href="/assets/grass-low.png"
            target="_blank"
            rel="noreferrer"
            class="group rounded-xl border border-[#e0e4d7] bg-white/60 p-4 transition-colors hover:bg-white"
            ><img
              src="/assets/grass-low.png"
              alt="低矮宽叶草丛"
              class="h-40 w-full object-contain transition-transform group-hover:-translate-y-1"
            />
            <p class="mt-3 text-sm">低矮草丛 <span class="float-right text-[#a6af99]">01</span></p>
            <p class="mt-1 text-[11px] text-[#8b987e]">铺开底部，连接植物根部</p></a
          >
          <a
            href="/assets/grass-tall.png"
            target="_blank"
            rel="noreferrer"
            class="group rounded-xl border border-[#e0e4d7] bg-white/60 p-4 transition-colors hover:bg-white"
            ><img
              src="/assets/grass-tall.png"
              alt="细长叶片与草穗组成的高草"
              class="h-40 w-full object-contain transition-transform group-hover:-translate-y-1"
            />
            <p class="mt-3 text-sm">细叶高草 <span class="float-right text-[#a6af99]">02</span></p>
            <p class="mt-1 text-[11px] text-[#8b987e]">高低错落，勾出草坪轮廓</p></a
          >
          <a
            href="/assets/flower-daisy.png"
            target="_blank"
            rel="noreferrer"
            class="group rounded-xl border border-[#e0e4d7] bg-white/60 p-4 transition-colors hover:bg-white"
            ><img
              src="/assets/flower-daisy.png"
              alt="奶油白花瓣与黄色花心的雏菊"
              class="h-40 w-full object-contain transition-transform group-hover:-translate-y-1"
            />
            <p class="mt-3 text-sm">白色雏菊 <span class="float-right text-[#a6af99]">03</span></p>
            <p class="mt-1 text-[11px] text-[#8b987e]">奶油白花瓣，温暖的花心</p></a
          >
          <a
            href="/assets/flower-violet.png"
            target="_blank"
            rel="noreferrer"
            class="group rounded-xl border border-[#e0e4d7] bg-white/60 p-4 transition-colors hover:bg-white"
            ><img
              src="/assets/flower-violet.png"
              alt="长在细茎上的淡紫色小花"
              class="h-40 w-full object-contain transition-transform group-hover:-translate-y-1"
            />
            <p class="mt-3 text-sm">淡紫小花 <span class="float-right text-[#a6af99]">04</span></p>
            <p class="mt-1 text-[11px] text-[#8b987e]">少量冷色，散落在草叶之间</p></a
          >
          <a
            href="/assets/flower-yellow.png"
            target="_blank"
            rel="noreferrer"
            class="group rounded-xl border border-[#e0e4d7] bg-white/60 p-4 transition-colors hover:bg-white"
            ><img
              src="/assets/flower-yellow.png"
              alt="细茎上的暖黄色野花"
              class="h-40 w-full object-contain transition-transform group-hover:-translate-y-1"
            />
            <p class="mt-3 text-sm">黄色野花 <span class="float-right text-[#a6af99]">05</span></p>
            <p class="mt-1 text-[11px] text-[#8b987e]">小而轻的暖色点缀</p></a
          >
        </div>
      </section>
      <p class="mt-6 text-[11px] leading-6 text-[#939c88]">
        花草原画由 ImageGen 生成，沿用选定的 C
        版笔触与色彩；每种素材均保留透明背景，可独立排列和变形。
      </p>
    </main>
  </body>
</html>
