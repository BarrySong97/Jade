<!doctype html>
<!--
  @purpose 对照首页原头像与三渲二手绘版本
  @role 独立设计预览，不作为 Astro 页面发布
  @deps preview.mjs 编译 Tailwind；preview.js 切换观察底色；两张透明 PNG
  @gotcha 原画按完整画布显示，不裁切或自动替换首页头像
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>头像 · 三渲二预览</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/preview.js"></script>
  </head>
  <body
    data-surface="light"
    class="group min-h-screen bg-[#f5f4f0] font-sans text-[#272b28] antialiased data-[surface=dark]:bg-[#151917] data-[surface=dark]:text-[#ebece6]"
  >
    <main class="mx-auto max-w-5xl px-5 py-10 sm:px-8 sm:py-14">
      <header class="mb-8 flex flex-wrap items-end justify-between gap-6">
        <div>
          <p class="mb-3 text-xs tracking-[0.18em] opacity-50">PORTRAIT STUDY / 01</p>
          <h1 class="text-3xl font-medium tracking-tight sm:text-4xl">同一张头像，换一种笔触。</h1>
          <p class="mt-3 text-sm leading-7 opacity-65">
            黑白线稿与三渲二手绘。先看神态，再看放进首页的大小。
          </p>
        </div>
        <div class="flex gap-2" role="group" aria-label="预览底色">
          <button
            type="button"
            data-surface-choice="light"
            aria-pressed="true"
            class="cursor-pointer rounded-full border border-current/15 px-4 py-2 text-sm aria-pressed:bg-[#293b32] aria-pressed:text-white focus-visible:outline-2 focus-visible:outline-offset-4 group-data-[surface=dark]:aria-pressed:bg-[#d7dfc9] group-data-[surface=dark]:aria-pressed:text-[#253128]"
          >
            浅色底
          </button>
          <button
            type="button"
            data-surface-choice="dark"
            aria-pressed="false"
            class="cursor-pointer rounded-full border border-current/15 px-4 py-2 text-sm aria-pressed:bg-[#293b32] aria-pressed:text-white focus-visible:outline-2 focus-visible:outline-offset-4 group-data-[surface=dark]:aria-pressed:bg-[#d7dfc9] group-data-[surface=dark]:aria-pressed:text-[#253128]"
          >
            深色底
          </button>
        </div>
      </header>

      <section aria-label="放大对照" class="grid gap-5 md:grid-cols-2">
        <figure
          class="overflow-hidden rounded-2xl border border-current/10 bg-white group-data-[surface=dark]:bg-[#202723]"
        >
          <a
            href="/original.png"
            target="_blank"
            rel="noopener"
            class="block p-5 sm:p-8"
            aria-label="打开原头像 PNG"
          >
            <img
              src="/original.png"
              alt="首页原头像：戴黑框眼镜、短发、深色上衣的黑白手绘半身肖像"
              width="1330"
              height="1182"
              class="aspect-[8/7] w-full object-contain"
              fetchpriority="high"
            />
          </a>
          <figcaption
            class="flex items-baseline justify-between gap-3 border-t border-current/10 px-6 py-5"
          >
            <div>
              <span class="mr-2 text-xs opacity-45">01</span
              ><span class="font-medium">首页原头像</span>
            </div>
            <span class="text-xs opacity-55">黑白 · 线条</span>
          </figcaption>
        </figure>
        <figure
          class="overflow-hidden rounded-2xl border border-current/10 bg-white group-data-[surface=dark]:bg-[#202723]"
        >
          <a
            href="/portrait-painted-v1.png"
            target="_blank"
            rel="noopener"
            class="block p-5 sm:p-8"
            aria-label="打开三渲二头像 PNG"
          >
            <img
              src="/portrait-painted-v1.png"
              alt="三渲二头像：保留相同眼镜、发型和朝向，暖色肤色配合手绘笔触与块面明暗"
              width="1341"
              height="1173"
              class="aspect-[8/7] w-full object-contain"
              fetchpriority="high"
            />
          </a>
          <figcaption
            class="flex items-baseline justify-between gap-3 border-t border-current/10 px-6 py-5"
          >
            <div>
              <span class="mr-2 text-xs opacity-45">02</span
              ><span class="font-medium">三渲二 · 第一版</span>
            </div>
            <span class="text-xs opacity-55">色彩 · 块面 · 笔触</span>
          </figcaption>
        </figure>
      </section>

      <section aria-labelledby="home-size-title" class="mt-12">
        <div class="mb-5 flex flex-wrap items-baseline justify-between gap-2">
          <h2 id="home-size-title" class="text-lg font-medium">缩小到首页尺寸</h2>
          <p class="text-xs opacity-55">图片宽度：桌面 212px / 手机 190px</p>
        </div>
        <div class="grid gap-5 sm:grid-cols-2">
          <figure
            class="flex flex-col items-center gap-5 rounded-2xl border border-current/10 bg-white px-6 py-8 group-data-[surface=dark]:bg-[#202723]"
          >
            <img
              src="/original.png"
              alt="首页尺寸的原头像"
              width="1330"
              height="1182"
              class="h-auto w-[190px] sm:w-[212px]"
            />
            <figcaption class="text-xs opacity-55">原头像</figcaption>
          </figure>
          <figure
            class="flex flex-col items-center gap-5 rounded-2xl border border-current/10 bg-white px-6 py-8 group-data-[surface=dark]:bg-[#202723]"
          >
            <img
              src="/portrait-painted-v1.png"
              alt="首页尺寸的三渲二头像"
              width="1341"
              height="1173"
              class="h-auto w-[190px] sm:w-[212px]"
            />
            <figcaption class="text-xs opacity-55">三渲二头像</figcaption>
          </figure>
        </div>
      </section>

      <footer
        class="mt-8 flex flex-wrap items-center justify-between gap-3 text-xs leading-6 opacity-60"
      >
        <p>预览稿 · 当前首页仍使用原头像。点击大图查看透明 PNG。</p>
        <a href="/portrait-painted-v1.png" download class="underline underline-offset-4"
          >下载这一版 ↗</a
        >
      </footer>
    </main>
  </body>
</html>
